[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-regional-bridge"
version = "0.1.0"
description = "Type-safe Model Context Protocol (MCP) adapters and schema normalizers for regional APIs and low-resource language workflows."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Abror2604" }
]
keywords = ["mcp", "llm", "adapter", "unicode", "normalization", "open-source"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
